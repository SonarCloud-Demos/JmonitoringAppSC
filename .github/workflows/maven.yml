name: Java CI with Maven

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "staging"
      - "develop"
  pull_request:
    # Trigger on open, when new code is pushed (synchronize), or when reopened
    types: [opened, synchronize, reopened]
    branches:
      - "main"
      - "staging"
      - "develop"

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Required for SonarCloud to comment on PRs
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven # This handles caching automatically; no need for a separate step

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build with Maven
        # NOTE: -DskipTests means SonarCloud will report 0% coverage. 
        # Consider removing -DskipTests if you want coverage metrics.
        run: mvn clean verify -DskipTests

      - name: Run Sonar analysis with Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn sonar:sonar 
          -Dsonar.organization=sonarcloud-demos 
          -Dsonar.architecture.configpath=architecture.json 
          -Dsonar.projectKey=SonarCloud-Demos_JmonitoringAppSC 
          -Dsonar.host.url=https://sonarcloud.io 
